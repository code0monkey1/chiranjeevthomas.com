<svg xmlns="http://www.w3.org/2000/svg" width="960" height="392" viewBox="0 0 960 392" role="img" aria-label="Animated deploy sync: unchanged chunks are skipped, edited and new chunks are upserted and re-embedded by Pinecone, deleted chunks are removed.">
