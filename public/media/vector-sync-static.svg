<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Animated diagram: each version of the content gets its own Pinecone namespace. While deploy A is live and searching production-42f3b881, build B (one section edited) fills a new namespace, production-9c1e07aa, embedding all 43 chunks (about 6K tokens). Publishing B switches the site, its answers and its namespace together. After publish, pruning keeps the live namespace plus the 4 most recently published. A CSS-only build C has the same content hash, reuses the namespace and embeds nothing.">
<title>Animated diagram: each version of the content gets its own Pinecone namespace. While deploy A is live and searching production-42f3b881, build B (one section edited) fills a new namespace, production-9c1e07aa, embedding all 43 chunks (about 6K tokens). Publishing B switches the site, its answers and its namespace together. After publish, pruning keeps the live namespace plus the 4 most recently published. A CSS-only build C has the same content hash, reuses the namespace and embeds nothing.</title>
<rect x="0.5" y="0.5" width="959" height="439" rx="16" fill="#FFFFFF" stroke="#E7E5E4" />
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D6D3D1" /></marker></defs>
<text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1C1917" text-anchor="start">Each version of the content gets its own namespace</text>
<text x="30" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57534E" text-anchor="start">The build syncs into production-&lt;hash of the chunks&gt;. The live site keeps searching its own namespace until the new deploy is published.</text>
<text x="30" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#A0522D" text-anchor="start">deploys &amp; builds</text>
<text x="560" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#A0522D" text-anchor="start">Pinecone namespaces</text>
<rect x="30" y="110" width="250" height="34" rx="7" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1" />
<text x="44" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#1C1917" text-anchor="start">Deploy A · live</text>
<path d="M 288 127 L 552 127" fill="none" stroke="#D6D3D1" stroke-width="2" marker-end="url(#ah)" />
<text x="420" y="121" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#57534E" text-anchor="middle">searches</text>
<rect x="560" y="110" width="370" height="34" rx="7" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1" />
<text x="574" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#1C1917" text-anchor="start">production-42f3b881</text>
<text x="918" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#57534E" text-anchor="end">43 chunks</text>
<g opacity="1"><rect x="30" y="166" width="250" height="34" rx="7" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1" /><text x="44" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#1C1917" text-anchor="start">Build B · 1 section edited</text><path d="M 288 183 L 552 183" fill="none" stroke="#D6D3D1" stroke-width="2" marker-end="url(#ah)" /><text x="420" y="177" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#15803D" text-anchor="middle">sync · hash 9c1e07aa</text><rect x="560" y="166" width="370" height="34" rx="7" fill="#FAFAF9" stroke="#15803D" stroke-width="2" /><text x="574" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#15803D" text-anchor="start">production-9c1e07aa</text><text x="918" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#15803D" text-anchor="end">new · 43 embedded</text></g>
<g opacity="1"><text x="420" y="143" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">A is untouched while B builds</text></g>
<g opacity="1"><rect x="30" y="222" width="250" height="34" rx="7" fill="#FFF1E8" stroke="#E8955A" stroke-width="1" /><text x="44" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#A0522D" text-anchor="start">Publish B · one switch</text><path d="M 288 239 L 552 239" fill="none" stroke="#D6D3D1" stroke-width="2" marker-end="url(#ah)" /><text x="420" y="233" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#A0522D" text-anchor="middle">pages + answers + vectors</text><rect x="560" y="222" width="370" height="34" rx="7" fill="#FFF1E8" stroke="#E8955A" stroke-width="2" /><text x="574" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#A0522D" text-anchor="start">production-9c1e07aa</text><text x="918" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#A0522D" text-anchor="end">now live</text></g>
<g opacity="1"><rect x="800" y="117" width="126" height="20" rx="5" fill="#FFFFFF" /><text x="918" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#57534E" text-anchor="end">kept for rollback</text></g>
<g opacity="1"><rect x="30" y="278" width="250" height="34" rx="7" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1" /><text x="44" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#1C1917" text-anchor="start">onSuccess · prune</text><path d="M 288 295 L 552 295" fill="none" stroke="#D6D3D1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)" /><text x="420" y="289" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#57534E" text-anchor="middle">after publish only</text><rect x="560" y="278" width="370" height="34" rx="7" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1" /><text x="574" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#1C1917" text-anchor="start">keep live + 4 most recently published</text></g>
<g opacity="1"><rect x="30" y="334" width="250" height="34" rx="7" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1" /><text x="44" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#1C1917" text-anchor="start">Build C · CSS only</text><path d="M 288 351 L 552 351" fill="none" stroke="#D6D3D1" stroke-width="2" marker-end="url(#ah)" /><text x="420" y="345" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#57534E" text-anchor="middle">same hash 9c1e07aa</text><rect x="560" y="334" width="370" height="34" rx="7" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1" /><text x="574" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#1C1917" text-anchor="start">production-9c1e07aa</text><text x="918" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#57534E" text-anchor="end">reused · 0 embedded</text></g>
<text x="30" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57534E" text-anchor="start">A failed build changes nothing live and prunes nothing. Rolling back further than the kept versions falls back to keyword search.</text>
<text x="30" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57534E" text-anchor="start">Local development uses one editable “local” namespace, synced in place.</text>
</svg>