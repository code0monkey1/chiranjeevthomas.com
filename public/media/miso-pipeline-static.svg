<svg xmlns="http://www.w3.org/2000/svg" width="960" height="466" viewBox="0 0 960 466" role="img" aria-label="Animated diagram of Miso's retrieval pipeline: content is chunked and synced to Pinecone at build time; each question runs meaning and keyword search, fused, then answered by the Groq agent.">
<title>Animated diagram of Miso's retrieval pipeline: content is chunked and synced to Pinecone at build time; each question runs meaning and keyword search, fused, then answered by the Groq agent.</title>
<rect x="0.5" y="0.5" width="959" height="465" rx="16" fill="#FFFFFF" stroke="#E7E5E4" />
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D6D3D1" /></marker></defs>
<text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1C1917" text-anchor="start">How Miso answers a question</text>
<text x="30" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57534E" text-anchor="start">Build time prepares the vectors; request time searches them by meaning and by keyword, then the LLM answers only from what came back.</text>
<text x="30" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#A0522D" text-anchor="start">BUILD TIME · on every deploy</text>
<text x="30" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#A0522D" text-anchor="start">REQUEST TIME · on every question</text>
